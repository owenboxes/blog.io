<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>글 편집 — Build Notes</title><link rel="stylesheet" href="/assets/editor.css"><script src="/assets/editor.js" defer></script></head><body class="admin-page">
<header class="admin-header"><strong>글 편집</strong><span id="identity">로그인 확인 중</span><a id="login" hidden>다시 로그인</a><button id="logout">로그아웃</button></header>
<main class="admin-main"><p id="status" role="status" aria-live="polite">글을 불러오는 중입니다.</p><section id="picker" hidden><h1>수정할 글 선택</h1><div id="post-list"></div></section>
<div id="workspace" hidden><p class="admin-help">임시 저장은 이 브라우저에만 남습니다. <b>게시</b>를 눌러야 공개됩니다. Enter: 새 문단 · Shift+Enter: 같은 문단 줄바꿈. 붙여넣기는 일반 텍스트로 처리합니다.</p>
<div class="admin-toolbar"><button id="save-draft">임시 저장</button><button id="export">파일로 내보내기</button><button id="export-text">텍스트 백업</button><label class="import-button">불러오기<input id="import" type="file" accept="application/json,.json"></label><button id="toggle-preview" aria-pressed="false">미리보기</button><button id="publish" class="publish">게시</button><a id="view-public" hidden target="_blank" rel="noopener noreferrer">공개 글 보기 ↗</a></div>
<fieldset id="fields"><label>제목<input id="title" maxlength="200"></label><label>목록 요약<textarea id="summary" maxlength="1000" rows="3"></textarea></label><div id="blocks"></div><div class="add-blocks"><button data-add="paragraph">+ 문단</button><button data-add="heading">+ 소제목</button><button data-add="code">+ 코드</button><button data-add="list">+ 목록</button><button data-add="quote">+ 인용</button><button data-add="table">+ 표</button></div></fieldset>
<section id="preview-panel" hidden><h2>공개 화면 미리보기</h2><p>실습창은 이 화면에서 실행하지 않습니다.</p><article id="preview"></article></section></div></main></body></html>
