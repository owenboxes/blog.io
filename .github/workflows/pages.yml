name: Verify and deploy blog
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript tests
        run: node tests/run-js.cjs
      - name: Owner editor tests
        run: node --test tests/admin/*.test.mjs
      - name: Build owner editor Worker
        run: node admin/build.mjs
      - name: Install pinned Python runtime for integration tests
        run: npm install --prefix "$RUNNER_TEMP/python-runtime" --no-save pyodide@0.27.7
      - name: Real Pyodide worker integration tests
        run: node tests/test_worker_pyodide.cjs "$RUNNER_TEMP/python-runtime/node_modules/pyodide"
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment

